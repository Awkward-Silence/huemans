services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: huemans
      POSTGRES_PASSWORD: huemans
      POSTGRES_DB: huemans
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huemans -d huemans"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  database_data:
