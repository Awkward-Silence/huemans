# Podium deploys each top-level key as its own Application.
#
# web: the React (Vite) SPA. The nodejs/react template runs `npm ci && npm run build`
# in web/ and serves dist/ with nginx, so nothing runs on Node at runtime.
# No NODE_ENV: if it ever reached the build, `npm ci` would skip devDependencies
# (vite, typescript) and the build would fail.

web:
  src: web
  lang: nodejs
  framework: react

# api: the NestJS backend, at https://api-ffe90049.apperture.dev.
# Values are never written here: ${KEY} names a key of the podium-secrets Secret
# in the project's namespace, which the operator creates; a missing key just
# leaves the variable unset (without JEV_API_KEY the sentence adds no traits).
# Hostium mounts a Postgres for the service and hands its URI in DATABASE_URL.
# On every start, start:prod migrates, seeds the catalog and the demo event (both
# idempotent) and only then starts Nest: a new database comes up ready to play.
api:
  src: api
  lang: nodejs
  framework: nestjs
  environment:
    JEV_API_KEY: ${JEV_API_KEY}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  database:
    enable: true
    URL: ${DATABASE_URL}
