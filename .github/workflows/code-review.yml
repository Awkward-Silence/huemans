# AI code review of pull requests with reviewer-workflow.
# Copy it to .github/workflows/code-review.yml in the reviewed repository.
name: code-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    # Pull requests from forks get no secrets and a read-only token; drafts wait until ready.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container: registry.gitlab.com/apperturedev/reviewer-workflow:1.3.0
    # The review informs; it never blocks a pull request.
    continue-on-error: true
    timeout-minutes: 30
    env:
      REVIEWER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REVIEWER_PROVIDER: claude
      REVIEWER_MODEL: ""
      REVIEWER_LANGUAGE: es
      REVIEWER_OUTPUT_DIR: reviewer-output
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      # COPILOT_PROVIDER_BASE_URL: https://gateway.example.com/v1
      # COPILOT_PROVIDER_API_KEY: ${{ secrets.COPILOT_PROVIDER_API_KEY }}
    steps:
      # Without persist-credentials: false the token stays in .git/config, readable by the agents.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: reviewer run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-output
          path: reviewer-output/
          retention-days: 7
